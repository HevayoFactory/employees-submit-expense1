openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: See the caller's own claims
            claims:submit: Create or resubmit a claim
            claims:review: See the caller's direct reports' claims
            claims:approve: Approve a direct report's claim
            claims:reject: Reject a direct report's claim
            claims:read-all: See every approved claim
            export-batches:create: Export approved claims as a batch
            export-batches:read: See past export batches
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    LineItemInput:
      type: object
      required: [amount, expenseDate, merchant, category, receiptUrl]
      properties:
        amount: { type: number, format: decimal }
        expenseDate: { type: string, format: date }
        merchant: { type: string }
        category: { type: string, enum: [Travel, Meals, Lodging, Supplies, Other] }
        receiptUrl: { type: string }
    LineItem:
      allOf:
        - $ref: '#/components/schemas/LineItemInput'
        - type: object
          required: [id, claimId]
          properties:
            id: { type: string }
            claimId: { type: string }
    Claim:
      type: object
      required: [id, employeeId, status, lineItems]
      properties:
        id: { type: string }
        employeeId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string, nullable: true }
        exportBatchId: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
    ClaimInput:
      type: object
      required: [lineItems]
      properties:
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/LineItemInput' }
    Decision:
      type: object
      properties:
        reason: { type: string, description: required when rejecting }
    ExportBatch:
      type: object
      required: [id, exportedBy, exportedAt, claimIds]
      properties:
        id: { type: string }
        exportedBy: { type: string }
        exportedAt: { type: string, format: date-time }
        claimIds:
          type: array
          items: { type: string }
    ExportBatchInput:
      type: object
      required: [claimIds]
      properties:
        claimIds:
          type: array
          items: { type: string }
security:
  - oauth2: []
paths:
  /me/claims:
    get:
      operationId: listMyClaims
      summary: The caller's own claims
      security:
        - oauth2: [claims:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: The caller's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitClaim
      summary: Create a new claim
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: Claim created, pending approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: A line item is missing a required field or receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}:
    get:
      operationId: getMyClaim
      summary: The caller's claim, with its line items
      security:
        - oauth2: [claims:read]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404':
          description: No such claim for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: resubmitMyClaim
      summary: Edit and resubmit a rejected claim
      security:
        - oauth2: [claims:submit]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200':
          description: Claim updated and pending again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: The claim is not rejected, or a line item is incomplete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims:
    get:
      operationId: listTeamClaims
      summary: The caller's direct reports' pending claims, oldest first
      security:
        - oauth2: [claims:review]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: The direct reports' claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims/{claimId}:
    get:
      operationId: getTeamClaim
      summary: A direct report's claim, with its line items and receipts
      security:
        - oauth2: [claims:review]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404':
          description: No such claim among this manager's direct reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims/{claimId}/approve:
    post:
      operationId: approveTeamClaim
      summary: Approve a direct report's claim as a whole
      security:
        - oauth2: [claims:approve]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Claim approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: The claim is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim among this manager's direct reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims/{claimId}/reject:
    post:
      operationId: rejectTeamClaim
      summary: Reject a direct report's claim as a whole, with a reason
      security:
        - oauth2: [claims:reject]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Claim rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: The claim is not pending, or no reason was given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim among this manager's direct reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims:
    get:
      operationId: listApprovedClaims
      summary: Every approved claim, for export
      security:
        - oauth2: [claims:read-all]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: exported
          in: query
          schema: { type: boolean, description: filter to claims not yet exported }
      responses:
        '200':
          description: Approved claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /export-batches:
    get:
      operationId: listExportBatches
      summary: Past export batches
      security:
        - oauth2: [export-batches:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Export batches
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExportBatch' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createExportBatch
      summary: Export a set of approved claims as a CSV batch
      security:
        - oauth2: [export-batches:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportBatchInput' }
      responses:
        '201':
          description: Batch created; claims marked exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportBatch' }
        '400':
          description: A claim is not approved, or already exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /export-batches/{batchId}/download:
    get:
      operationId: downloadExportBatch
      summary: Download a batch's CSV file
      security:
        - oauth2: [export-batches:read]
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The CSV file
          content:
            text/csv:
              schema: { type: string }
        '404':
          description: No such batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
